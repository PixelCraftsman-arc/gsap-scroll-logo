<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Option 02 · Timed sequence</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="auto" class="mode-auto">

  <a class="mode-switch" href="index.html">All options</a>
  <a class="mode-switch mode-switch-alt" href="scroll.html">Scroll version</a>

  <section class="pin-wrap" aria-label="Timed hero to logo sequence">
    <div class="stage">
      <div class="bg-one" aria-hidden="true"></div>
      <div class="bg-two" aria-hidden="true"></div>
      <div class="canvas" id="canvas">
        <p class="line l1">CORPORATE</p>
        <p class="line l2">ADVISORY</p>
        <p class="line l3">DONE</p>
        <p class="line l4">DIFFERENTLY</p>
        <img class="logo-final" id="logo-final" src="img/logo-final.png" alt="" draggable="false" width="542" height="266">
      </div>
    </div>
  </section>

  <div class="auto-bar" role="group" aria-label="Playback controls">
    <button type="button" class="auto-btn" id="btn-replay" hidden>Replay</button>
    <p class="auto-status" id="auto-status">Playing</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
